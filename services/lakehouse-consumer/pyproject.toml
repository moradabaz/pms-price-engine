[project]
name = "lakehouse-consumer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.0",
    "pydantic-settings>=2.14.0",
    "structlog>=26.1.0",
    "pyiceberg[pyarrow,sql-sqlite]>=0.8.0,<0.9.0",
    "shared-schemas",
    "common",
    "lakehouse-shared",
]

[tool.uv.sources]
shared-schemas = { workspace = true }
common = { workspace = true }
lakehouse-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse_consumer"]

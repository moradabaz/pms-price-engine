[project]
name = "dbt-runner"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.14.0",
    "structlog>=26.1.0",
    "common",
]
# dbt-core/dbt-duckdb are deliberately NOT listed here — no dbt-core version
# is compatible with both this workspace's mypy pin and apache-beam's
# protobuf pin under one shared lockfile (see error-handling/dbt-core-
# incompatible-with-shared-lockfile-mypy-and-flink-pins.md). Installed into
# a separate venv in the Dockerfile instead; dbt is invoked as an external
# CLI via subprocess, the same shape as awslocal/docker/psql elsewhere in
# this project.

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_runner"]

[project]
name = "kinesis-kafka-bridge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.0",
    "kafka-python-ng>=2.2.0",
    "pydantic-settings>=2.14.0",
    "structlog>=26.1.0",
    "common",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinesis_kafka_bridge"]

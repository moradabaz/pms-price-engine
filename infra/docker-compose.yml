services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — payment_lines source, WAL enabled for Debezium CDC
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: pms_postgres
    environment:
      POSTGRES_USER: pms
      POSTGRES_PASSWORD: pms
      POSTGRES_DB: pms_db
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=4
        -c max_wal_senders=4
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../specs/phases/01-mock-app-db/payment_lines.sql:/docker-entrypoint-initdb.d/01-payment_lines.sql:ro
      - ../specs/phases/01-mock-app-db/apartment_market_segments.sql:/docker-entrypoint-initdb.d/02-apartment_market_segments.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms -d pms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Mock PM app — writes synthetic payment_lines rows (seed + continuous)
  # Build context is the repo root, not this service's own directory: it's a
  # uv workspace member and needs its sibling packages (libs/common,
  # libs/shared-schemas) and the root lockfile to build (see Dockerfile).
  # ---------------------------------------------------------------------------
  mock-pm-app:
    build:
      context: ..
      dockerfile: services/mock-pm-app/Dockerfile
    container_name: pms_mock_pm_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MOCK_APP_POSTGRES_DSN: postgresql://pms:pms@postgres:5432/pms_db
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Zookeeper — required by Kafka
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: pms_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # ---------------------------------------------------------------------------
  # Kafka — event bus for payment-events.v1
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: pms_kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ---------------------------------------------------------------------------
  # Kafka Connect — hosts the Debezium PostgreSQL connector
  # ---------------------------------------------------------------------------
  kafka-connect:
    image: debezium/connect:2.6
    container_name: pms_kafka_connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: pms-connect-group
      CONFIG_STORAGE_TOPIC: pms_connect_configs
      OFFSET_STORAGE_TOPIC: pms_connect_offsets
      STATUS_STORAGE_TOPIC: pms_connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    volumes:
      # Custom Debezium CustomConverter (see infra/debezium/custom-converters) that
      # renders DATE columns as "yyyy-MM-dd" strings instead of Debezium's default
      # epoch-day integer encoding — mounted into the postgres connector's own plugin
      # directory so it shares that plugin's classloader (no custom image needed).
      - ./debezium/custom-converters/target/custom-converters-1.0.0.jar:/kafka/connect/debezium-connector-postgres/custom-converters-1.0.0.jar:ro
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------------------
  # Apache Flink — stateful stream processing (PyFlink)
  # ---------------------------------------------------------------------------
  # Custom image (streaming/flink-jobs/Dockerfile), not the bare apache/flink
  # image: official Flink images ship Java-only, with no Python at all, and
  # PyFlink's Python UDFs must run inside the TaskManager process itself
  # (Beam portability framework) — so Python + this exact apache-flink pip
  # version must be installed on both jobmanager and taskmanager, not just
  # wherever `flink run` is invoked from. Image version corrected 2026-07-29
  # to apache/flink:2.3.0-java21, matching apache-flink==2.3.0 in
  # streaming/flink-jobs/pyproject.toml — the previous flink:2.0-java21 was a
  # real, unverified mismatch, not a deliberate choice.
  flink-jobmanager:
    build:
      context: ..
      dockerfile: streaming/flink-jobs/Dockerfile
    image: pms-flink-pyflink:2.3.0
    container_name: pms_flink_jobmanager
    command: jobmanager
    environment:
      # s3.* keys are cluster-wide (flink-conf.yaml), not per-job — the S3
      # filesystem plugin initializes from this global config when the
      # CheckpointCoordinator starts, before a job's own env.configure()
      # settings are in play. Must be set here on both jobmanager AND
      # taskmanager, not passed through the job's Configuration object.
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.bind-port: 8081
        s3.endpoint: http://localstack:4566
        s3.path.style.access: true
        s3.access-key: test
        s3.secret-key: test
      # Only needed where `flink run -py` is actually invoked (this
      # container) — FlinkJobSettings is read once at submission time,
      # then closed over by the already-serialized job graph shipped to
      # TaskManagers, not re-read there.
      FLINK_JOB_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FLINK_JOB_DYNAMODB_ENDPOINT_URL: http://localstack:4566
      FLINK_JOB_S3_ENDPOINT_URL: http://localstack:4566
      FLINK_JOB_CHECKPOINT_STORAGE_PATH: s3://pms-iceberg/flink-checkpoints
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview"]
      interval: 15s
      timeout: 10s
      retries: 5

  flink-taskmanager:
    build:
      context: ..
      dockerfile: streaming/flink-jobs/Dockerfile
    image: pms-flink-pyflink:2.3.0
    container_name: pms_flink_taskmanager
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        s3.endpoint: http://localstack:4566
        s3.path.style.access: true
        s3.access-key: test
        s3.secret-key: test
      # DynamoDbSinkFunction's boto3 client runs here — the operator executes
      # on the TaskManager, not the JobManager that merely submitted the job.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

  # ---------------------------------------------------------------------------
  # LocalStack — emulates AWS services locally (Kinesis, S3, DynamoDB)
  #
  #   Kinesis          → market-price-events stream
  #   S3               → pms-iceberg (Flink checkpoints) + pms-lakehouse (Iceberg warehouse, spec 05)
  #   DynamoDB         → hot path (current recommended price per apartment) + stream_checkpoints
  #   DynamoDB Streams  → CDC source for lakehouse-consumer (spec 05 §5, ADR-0006)
  #
  # No `glue` here — confirmed 2026-08-04, AWS Glue is Ultimate-tier only in
  # LocalStack, 501s on every call in Community. lakehouse-consumer/
  # lakehouse-maintenance use PyIceberg's SqlCatalog locally instead (spec 05
  # §10, pre-spec Decision C corrected) — real Glue Data Catalog is a Phase 7
  # (real AWS) promotion, not testable against this LocalStack tier at all.
  #
  # Single endpoint: http://localhost:4566
  # Credentials:     AWS_ACCESS_KEY_ID=test / AWS_SECRET_ACCESS_KEY=test
  # ---------------------------------------------------------------------------
  localstack:
    image: localstack/localstack:3.4
    container_name: pms_localstack
    environment:
      SERVICES: kinesis,s3,dynamodb,dynamodbstreams
      AWS_DEFAULT_REGION: eu-west-1
      KINESIS_PROVIDER: kinesalite
      PERSISTENCE: 1
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal kinesis list-streams"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------------------
  # Market ingestor — publishes synthetic market_price.v1 snapshots to Kinesis
  # (Phase 3). Build context is the repo root, same reasoning as mock-pm-app:
  # a uv workspace member needing sibling packages (libs/common,
  # libs/shared-schemas) and the root lockfile to build (see Dockerfile).
  # ---------------------------------------------------------------------------
  market-ingestor:
    build:
      context: ..
      dockerfile: services/market-ingestor/Dockerfile
    container_name: pms_market_ingestor
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      MARKET_INGESTOR_KINESIS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Kinesis→Kafka bridge — exists solely because no Kinesis connector runs on
  # Flink 2.x (error-handling/flink-2x-removes-legacy-sourcefunction-...md).
  # Republishes market-price-events verbatim onto a Kafka topic Stage B reads
  # via KafkaSource instead. Not a permanent architecture choice — revisit if
  # a Flink-2.x-compatible Kinesis connector ever ships.
  # ---------------------------------------------------------------------------
  kinesis-kafka-bridge:
    build:
      context: ..
      dockerfile: services/kinesis-kafka-bridge/Dockerfile
    container_name: pms_kinesis_kafka_bridge
    depends_on:
      localstack:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      BRIDGE_KINESIS_ENDPOINT_URL: http://localstack:4566
      BRIDGE_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Lakehouse consumer — DynamoDB Streams CDC into Iceberg (Phase 5, ADR-0006).
  # Reads price_decision's own change stream (never the table directly),
  # merges by decision_id into price_decision_raw. Never writes to pms-iceberg
  # (Flink's checkpoint bucket) — separate bucket, separate lifecycle.
  #
  # Iceberg catalog: PyIceberg SqlCatalog (SQLite on lakehouse_catalog,
  # shared with lakehouse-maintenance) — confirmed 2026-08-04, AWS Glue Data
  # Catalog is Ultimate-tier only in LocalStack, unavailable in Community.
  # Phase 7 promotes to a real Glue Data Catalog (code change, not just
  # endpoint/credentials — see build_catalog()'s docstring).
  # ---------------------------------------------------------------------------
  lakehouse-consumer:
    build:
      context: ..
      dockerfile: services/lakehouse-consumer/Dockerfile
    container_name: pms_lakehouse_consumer
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      LAKEHOUSE_CONSUMER_DYNAMODB_ENDPOINT_URL: http://localstack:4566
      LAKEHOUSE_CONSUMER_S3_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - lakehouse_catalog:/data/catalog
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Lakehouse maintenance — scheduled PyIceberg-native-equivalent compaction
  # (manual scan()+overwrite() — see error-handling/pyiceberg-native-
  # compaction-unavailable-under-shared-lockfile-pyarrow-pin.md) on
  # price_decision_raw. Separate from the consumer on purpose (spec 05 §6,
  # pre-spec Decision D) — writing and maintaining are different
  # responsibilities, no Glue Job/Spark.
  # ---------------------------------------------------------------------------
  lakehouse-maintenance:
    build:
      context: ..
      dockerfile: services/lakehouse-maintenance/Dockerfile
    container_name: pms_lakehouse_maintenance
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      LAKEHOUSE_MAINTENANCE_S3_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - lakehouse_catalog:/data/catalog
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # dbt runner — transforms price_decision_raw (Iceberg) into the Kimball
  # marts Phase 6 reads (spec 05 §7-9). Tick container, same shape as
  # market-ingestor/lakehouse-maintenance: dbt seed+run+test on an interval,
  # not triggered by writes. dbt-core/dbt-duckdb live in their own venv
  # inside the image (Dockerfile) — see error-handling/dbt-core-
  # incompatible-with-shared-lockfile-mypy-and-flink-pins.md.
  # ---------------------------------------------------------------------------
  dbt-runner:
    build:
      context: ..
      dockerfile: services/dbt-runner/Dockerfile
    container_name: pms_dbt_runner
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      # DuckDB's s3_endpoint setting wants host:port, no scheme — unlike the
      # http://localstack:4566 boto3 endpoint_url used by the other services.
      DBT_S3_ENDPOINT: localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: eu-west-1
      DBT_DUCKDB_PATH: /data/dbt/pms_lakehouse.duckdb
    volumes:
      - dbt_warehouse:/data/dbt
    restart: unless-stopped

volumes:
  postgres_data:
  localstack_data:
  dbt_warehouse:
  lakehouse_catalog:

[project]
name = "lakehouse-shared"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.14.0",
    "pyiceberg[sql-sqlite]>=0.8.0,<0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse_shared"]
